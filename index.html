<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>豚骨拉面小世界</title>
<style>
:root{--ink:#2a1a12;--paper:#fff6e6;--card:rgba(255,246,230,.94);--line:#c9482b;--sub:#6b4a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fbeedd;--paper:#2b1b14;--card:rgba(43,27,20,.94);--sub:#d9b9a2}}
:root[data-theme="dark"]{--ink:#fbeedd;--paper:#2b1b14;--card:rgba(43,27,20,.94);--sub:#d9b9a2}
html,body{height:100%;margin:0;overflow:hidden;background:#3a2118;color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif}
canvas{display:block;touch-action:none;cursor:grab}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 16px;pointer-events:none;color:#fff6e6;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#top h1{margin:0;font-size:22px;letter-spacing:.12em;font-weight:800}
#top p{margin:2px 0 0;font-size:12px;opacity:.85}
@media (max-width:640px){#top{padding-right:122px}#top h1{font-size:19px}#top p{font-size:11.5px}#count,#soup{font-size:12px;padding:3px 10px}}
[hidden]{display:none!important}
canvas,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#mouth{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);width:88px;height:88px;border-radius:50%;background:var(--card);color:var(--ink);border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.4;z-index:6;pointer-events:none;transition:transform .15s,background .15s}
#mouth.on{transform:scale(1.25);background:#f2b632}
#tip{position:fixed;display:none;pointer-events:none;z-index:5;background:var(--card);color:var(--ink);padding:3px 11px;border:1.5px solid var(--line);border-radius:999px;font-size:12.5px;transform:translate(14px,-30px);white-space:nowrap}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,4,0,.5))}
#count{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
#soup{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
#card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:460px;margin:0 auto;background:var(--card);color:var(--ink);border-left:6px solid var(--line);border-radius:6px 16px 16px 6px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .25s}
#card h2{margin:0 0 4px;font-size:18px}
#card p{margin:3px 0;font-size:13.5px;line-height:1.6}
#card .fun{color:var(--sub);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{font:inherit;font-size:13px;border:0;border-radius:999px;padding:7px 14px;background:var(--line);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--sub)}
button.on{background:var(--line);color:#fff;border-color:var(--line)}
button:focus-visible{outline:3px solid #f2b632;outline-offset:2px}
</style>
</head>
<body>
<div id="top"><h1>豚骨拉面小世界</h1><p>拖动旋转 · 双指缩放 · 点一点食材 · 长按拿起，拖进“吃掉”圈</p></div>
<div id="tip"></div><div id="mouth" hidden>😋<br>拖到这里吃</div><div id="count">已吃 0 / 0</div><div id="soup">🍲 汤 100%</div>
<div id="card"><h2 id="n">🍜 欢迎光临</h2><p id="d">一碗奶白浓汤的豚骨拉面正冒着热气。点点看：叉烧、溏心蛋、鱼板、海苔、玉米……每一样都有故事。</p><p class="fun" id="f"></p>
<div class="row"><button id="eat" hidden>吃掉它 😋</button><button class="ghost" id="reset">重新上一碗</button><button class="ghost" id="phys">🧲 物理模式</button><button class="ghost" id="shake" hidden>🫨 摇一摇</button><button class="ghost" id="tSpoon">🥄 勺子</button><button class="ghost" id="tChop">🥢 筷子</button><button class="ghost" id="demo">🍲 汤少演示</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x3a2118);scene.fog=new THREE.Fog(0x3a2118,16,40);
const cam=new THREE.PerspectiveCamera(45,1,.1,100);
scene.add(new THREE.HemisphereLight(0xfff0d8,0x4a2a1a,.85));
const sun=new THREE.DirectionalLight(0xffe2b0,.9);sun.position.set(4,9,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6});scene.add(sun);
const M=(c,r=.6,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r},o));
const add=(g,m,x,y,z,sh=true)=>{m.position.set(x,y,z);m.castShadow=sh;g.add(m);return m};
const R=(a,b)=>a+Math.random()*(b-a);
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t}
const wood=()=>{const t=cv(512,512,(x,w,h)=>{x.fillStyle='#a8703f';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){x.strokeStyle='rgba('+(60+R(0,40)|0)+','+(30+R(0,20)|0)+',10,'+R(.05,.2)+')';x.lineWidth=R(.5,3);x.beginPath();const y=R(0,h);x.moveTo(0,y);for(let k=1;k<=8;k++)x.lineTo(k*w/8,y+R(-6,6));x.stroke()}});t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t};
const brothTex=cv(512,512,(x,w,h)=>{const g=x.createRadialGradient(256,256,20,256,256,256);g.addColorStop(0,'#f0dcb4');g.addColorStop(1,'#d9b980');x.fillStyle=g;x.fillRect(0,0,w,h);
for(let i=0;i<70;i++){x.fillStyle='rgba(255,250,235,.35)';x.beginPath();x.arc(R(0,w),R(0,h),R(6,22),0,6.3);x.fill()}
for(let i=0;i<110;i++){x.fillStyle='rgba(230,160,50,.35)';x.beginPath();x.arc(R(0,w),R(0,h),R(3,12),0,6.3);x.fill();x.strokeStyle='rgba(255,235,170,.6)';x.lineWidth=1.2;x.stroke()}
for(let i=0;i<14;i++){x.fillStyle='rgba(40,18,8,.55)';x.beginPath();x.ellipse(R(100,420),R(100,420),R(8,30),R(4,14),R(0,3),0,0,6.3);x.fill()}
for(let i=0;i<260;i++){x.fillStyle=i%3?'rgba(30,20,12,.8)':'rgba(120,90,50,.8)';x.fillRect(R(0,w),R(0,h),R(2,4),R(2,3))}});
const chaTex=cv(256,256,x=>{x.fillStyle='#2e1608';x.fillRect(0,0,256,256);
for(let i=0;i<=12;i++){const rr=120-i*8.5,cx=128+i*.8;x.beginPath();for(let k=0;k<=48;k++){const a=k/48*6.283,r=rr*(1+.05*Math.sin(a*3+i)+.03*Math.sin(a*5+i*2)),px=cx+Math.cos(a)*r,py=128+Math.sin(a)*r;k?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fillStyle=i==0?'#4a2810':i%2?'#7a6548':'#6a3626';x.fill()}
const q=x.createRadialGradient(128,128,70,128,128,128);q.addColorStop(0,'rgba(30,12,4,0)');q.addColorStop(1,'rgba(20,8,2,.7)');x.fillStyle=q;x.fillRect(0,0,256,256);
for(let i=0;i<40;i++){x.fillStyle='rgba(10,4,1,.5)';x.beginPath();x.arc(R(20,236),R(20,236),R(1.5,5),0,6.3);x.fill()}});
const chaSide=cv(64,128,x=>{const q=x.createLinearGradient(0,0,0,128);[[0,'#2e1608'],[.16,'#4a2810'],[.28,'#7a6548'],[.5,'#6a3626'],[.72,'#7a6548'],[.88,'#4a2810'],[1,'#2e1608']].forEach(a=>q.addColorStop(a[0],a[1]));x.fillStyle=q;x.fillRect(0,0,64,128)});
const noriTex=cv(256,256,x=>{x.beginPath();const n=44;for(let k=0;k<n;k++){const sd=k/n*4|0,t=(k/n*4)%1,e=(.01+Math.random()*.045)*256,pt=[[t*256,e],[256-e,t*256],[256-t*256,256-e],[e,256-t*256]][sd];k?x.lineTo(pt[0],pt[1]):x.moveTo(pt[0],pt[1])}x.closePath();
 const g2=x.createLinearGradient(0,0,256,256);g2.addColorStop(0,'#101a0c');g2.addColorStop(.5,'#0b1008');g2.addColorStop(1,'#14200e');x.fillStyle=g2;x.fill();x.save();x.clip();
 for(let i=0;i<600;i++){x.fillStyle='rgba('+(30+R(0,30)|0)+','+(45+R(0,35)|0)+',20,'+R(.1,.45)+')';x.fillRect(R(0,256),R(0,256),R(1,3),R(1,5))}
 for(let i=0;i<26;i++){x.strokeStyle='rgba(4,8,3,.45)';x.lineWidth=R(1,3);x.beginPath();const y=R(0,256);x.moveTo(0,y);x.lineTo(256,y+R(-10,10));x.stroke()}x.restore()});
const leafTex=cv(128,256,x=>{const q=x.createLinearGradient(0,0,0,256);q.addColorStop(0,'#0b2a0f');q.addColorStop(1,'#175020');x.fillStyle=q;x.fillRect(0,0,128,256);
 for(let i=0;i<60;i++){x.fillStyle='rgba('+(20+R(0,30)|0)+','+(70+R(0,40)|0)+',25,'+R(.12,.3)+')';x.beginPath();x.arc(R(0,128),R(0,256),R(6,20),0,6.3);x.fill()}
 x.strokeStyle='rgba(120,170,80,.55)';x.lineWidth=2;x.beginPath();x.moveTo(64,0);x.lineTo(64,256);x.stroke();
 x.strokeStyle='rgba(80,130,55,.28)';x.lineWidth=1;for(let y=20;y<256;y+=34){x.beginPath();x.moveTo(64,y);x.quadraticCurveTo(40,y-14,12,y-40);x.moveTo(64,y);x.quadraticCurveTo(88,y-14,116,y-40);x.stroke()}});

// 小世界：木桌圆台 + 红叶
const table=new THREE.Mesh(new THREE.CylinderGeometry(6,6.4,.8,64),new THREE.MeshStandardMaterial({map:wood(),roughness:.7}));table.position.y=-.4;table.receiveShadow=true;scene.add(table);
const cloth=new THREE.Mesh(new THREE.CylinderGeometry(5.2,5.2,.04,64),M(0xfaf3e6,.9));cloth.position.y=.02;cloth.receiveShadow=true;scene.add(cloth);
for(let i=0;i<14;i++){const a=R(0,6.28),r=R(3.4,5),l=new THREE.Mesh(new THREE.CircleGeometry(.22,5),M([0xd2562a,0xe89a2f,0xa83a22][i%3],.9,{side:THREE.DoubleSide}));
l.rotation.x=-Math.PI/2;l.rotation.z=R(0,6);l.position.set(Math.cos(a)*r,.06,Math.sin(a)*r);scene.add(l)}

// 碗
const prof=[[0,0],[.9,0],[1.1,.08],[1.7,.5],[2.1,1.15],[2.18,1.25],[2.1,1.25],[2.02,1.15],[1.6,.55],[1.0,.2],[0,.2]].map(p=>new THREE.Vector2(p[0],p[1]));
const bowl=new THREE.Mesh(new THREE.LatheGeometry(prof,64),new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.15,clearcoat:1,side:THREE.DoubleSide}));bowl.castShadow=bowl.receiveShadow=true;scene.add(bowl);
const Y=1.0;
const broth=new THREE.Mesh(new THREE.CylinderGeometry(1.92,1.92,.05,64),new THREE.MeshPhysicalMaterial({map:brothTex,roughness:.3,clearcoat:.8,clearcoatRoughness:.2}));broth.position.y=Y-.03;scene.add(broth);

// 食材
const items=[];
function mk(name,emoji,desc,fun){const g=new THREE.Group();g.userData={name,emoji,desc,fun,t:-1,eaten:false,s:1,hov:false};scene.add(g);items.push(g);return g}

// 面条
{const g=mk('面条','🍜','细直的豚骨拉面，咬起来有嚼劲，裹满奶白浓汤。','福冈博多拉面讲究“细面”，煮 30 秒左右就要上桌，还能免费“替玉”加面。'),m=new THREE.MeshPhysicalMaterial({color:0xeccb7c,roughness:.3,clearcoat:.55,clearcoatRoughness:.25});
var strands=[],nm=new Map();
for(let i=0;i<28;i++){const a0=R(0,6.28),dir=Math.random()<.5?1:-1,y0=Y+.035+(i%5)*.02,P=[];let a=a0,r=R(.3,1.25);
 for(let k=0;k<12;k++){const rr=r+Math.sin(k*2.1+i*1.7)*.05;P.push(new THREE.Vector3(Math.cos(a)*rr,y0+Math.sin(k*1.3+i)*.01,Math.sin(a)*rr));a+=dir*(.32+R(-.05,.05));r=Math.min(1.45,Math.max(.25,r+R(-.14,.14)))}
 const st={P,P0:P.map(v=>v.clone()),Q:P.map(v=>v.clone()),rest:[],mesh:null,t:0,eaten:false,rad:.04*R(.9,1.1)};
 for(let k=1;k<P.length;k++)st.rest.push(P[k].distanceTo(P[k-1]));
 st.mesh=new THREE.Mesh(new THREE.BufferGeometry(),m);g.add(st.mesh);nm.set(st.mesh,st);strands.push(st);rebuild(st)}}
// 叉烧
{const g=mk('叉烧','🥩','炙烤过的五花叉烧，肥瘦相间，入口即化，边缘带焦香。','叉烧先卷起来用酱油、味醂慢炖，再切片，用火枪炙烤一下表面。'),m=[new THREE.MeshStandardMaterial({map:chaSide,roughness:.5}),new THREE.MeshPhysicalMaterial({map:chaTex,roughness:.38,clearcoat:.5,clearcoatRoughness:.3}),new THREE.MeshStandardMaterial({map:chaSide,roughness:.6})];
[[-.95,1.12,.95,-.4],[.42,1.2,1.22,-.05]].forEach(([x,y,z,r])=>{const s=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.17,48),m),x,y,z);s.scale.set(1.15,1,.75);s.rotation.order='YXZ';s.rotation.set(-.5,r,0);
const s2=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.02,24),new THREE.MeshPhysicalMaterial({color:0x3a1a08,roughness:.1,clearcoat:1,transparent:true,opacity:.22,depthWrite:false})),x,y+.08,z-.04,false);s2.scale.set(1.15,1,.6);s2.rotation.order='YXZ';s2.rotation.set(-.5,r,0)})}
// 溏心蛋
{const g=mk('溏心蛋','🥚','酱油腌过的半熟蛋，蛋白入味，蛋黄像流心的橙色小太阳。','这叫“味玉”：水煮约 6 分半后冰镇，再腌一夜才会有漂亮的流心。'),w=M(0xe8b878,.4),y=new THREE.MeshPhysicalMaterial({color:0xf2760f,roughness:.2,clearcoat:1});
const e=new THREE.Group();e.position.set(-1.0,Y+.15,-.6);e.rotation.set(.22,.4,0);g.add(e);
const eggTex=cv(256,256,x=>{const q=x.createRadialGradient(128,128,0,128,128,128);q.addColorStop(0,'#fff3d2');q.addColorStop(.55,'#f8e2ae');q.addColorStop(.82,'#d9a35e');q.addColorStop(1,'#a8672b');x.fillStyle=q;x.fillRect(0,0,256,256)});
const a=new THREE.Mesh(new THREE.SphereGeometry(.5,32,16,0,6.283,1.5708,1.5708),M(0xd9a35e,.4));a.scale.set(1,.7,1.25);a.castShadow=true;e.add(a);
const cap=new THREE.Mesh(new THREE.CircleGeometry(.5,40),new THREE.MeshStandardMaterial({map:eggTex,roughness:.35}));cap.rotation.x=-1.5708;cap.scale.set(1,1.25,1);e.add(cap);
const gold=new THREE.MeshPhysicalMaterial({color:0xf7b52c,roughness:.15,clearcoat:1,transparent:true,opacity:.92});
const rim=new THREE.Mesh(new THREE.CylinderGeometry(.3,.34,.03,32),gold);rim.position.y=.014;rim.scale.z=1.3;e.add(rim);
const yk=new THREE.Mesh(new THREE.SphereGeometry(.26,32,16,0,6.283,0,1.5708),new THREE.MeshPhysicalMaterial({color:0xf26a0e,roughness:.1,clearcoat:1,clearcoatRoughness:.04}));yk.scale.set(1,.6,1.3);yk.position.y=.025;e.add(yk);
[[1.15,.42],[1.57,.55],[2.05,.4]].forEach(([an,L])=>{const d=new THREE.Mesh(new THREE.SphereGeometry(.1,12,8),gold);d.scale.set(L*5,.22,.9);d.position.set(Math.cos(an)*.36,.02,Math.sin(an)*.45);d.rotation.y=-an;e.add(d)});
const dr=new THREE.Mesh(new THREE.SphereGeometry(.1,12,8),gold);dr.scale.set(.9,.35,2.6);dr.position.set(.08,-.1,.66);dr.rotation.x=.9;
const pu=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.012,28),M(0xf59a1b,.12,{transparent:true,opacity:.85}));pu.scale.set(1.4,1,.8);pu.position.set(-.3,Y+.012,0);pu.rotation.y=.4;g.add(pu);
}
// 鱼板
{const g=mk('鱼板','🍥','带粉红漩涡的鱼糕片，口感弹牙，是拉面里的小装饰。','“鸣门卷”得名于德岛的鸣门漩涡，切片上的螺旋就是那个旋涡。'),w=M(0xfff7ee,.5),r=M(0xe0405a,.5);
const c=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.08,8),w),-.15,Y+.12,-1.3);c.rotation.x=-.5;
const pts=[];for(let k=0;k<44;k++){const a=k*.3,q=.03+k*.0053;pts.push(new THREE.Vector3(Math.cos(a)*q,0,Math.sin(a)*q))}
const t=add(g,new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,.022,6),r),-.15,Y+.16,-1.32,false);t.rotation.x=-.5}
// 海苔
{const g=mk('海苔','🌑','三片酥脆的烤海苔，竖在碗边，浸一下汤就变得鲜香柔软。','海苔插在碗边是为了保持酥脆，吃之前可以蘸一蘸豚骨汤。'),m=new THREE.MeshStandardMaterial({map:noriTex,alphaTest:.5,roughness:.45,metalness:.05,side:THREE.DoubleSide});
[[-1.05,1.0,1.35,.42],[-.78,.95,1.45,.5],[-.52,1.0,1.25,.36]].forEach(([a,w,h,t],i)=>{
 const nx=8,ny=10,pos=[],uv=[],idx=[],Rb=1.78;
 for(let j=0;j<=ny;j++)for(let k=0;k<=nx;k++){const v=j/ny*h,sx=(k/nx-.5)*w,ph=a+sx/Rb,r=Rb+v*Math.sin(t)+v*v*.12+Math.sin(sx*5+i)*.02,yy=Y-.02+v*Math.cos(t)-v*v*.03;pos.push(Math.cos(ph)*r,yy,Math.sin(ph)*r);uv.push(k/nx,j/ny)}
 for(let j=0;j<ny;j++)for(let k=0;k<nx;k++){const q=j*(nx+1)+k;idx.push(q,q+1,q+nx+1,q+1,q+nx+2,q+nx+1)}
 const ge=new THREE.BufferGeometry();ge.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));ge.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));ge.setIndex(idx);ge.computeVertexNormals();
 const oo=new THREE.Object3D();oo.rotation.order='YXZ';oo.rotation.set(t,Math.PI/2-a,0);oo.updateMatrix();
 const rr=Rb+Math.sin(t)*h/2,mid=new THREE.Vector3(Math.cos(a)*rr,Y-.02+Math.cos(t)*h/2,Math.sin(a)*rr);
 ge.applyMatrix4(new THREE.Matrix4().compose(mid,oo.quaternion,new THREE.Vector3(1,1,1)).invert());
 const p=new THREE.Mesh(ge,m);p.position.copy(mid);p.quaternion.copy(oo.quaternion);p.castShadow=true;g.add(p)})}
// 玉米
{const g=mk('玉米粒','🌽','金黄香甜的玉米粒，给浓郁的汤增添一点清甜。','玉米是北海道味噌拉面的招牌配料，豚骨拉面里偶尔也会出现。'),m=M(0xffd23a,.35);
